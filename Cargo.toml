"[package]\nname = \"bevy_text\"\nversion = \"0.19.0-dev\"\npublish = false\nedition = \"2024\"\ndescription = \"Provides text functionality for Bevy Engine\"\nhomepage = \"https://bevy.org\"\nrepository = \"https://github.com/bevyengine/bevy\"\nlicense = \"MIT OR Apache-2.0\"\nkeywords = [\"bevy\"]\n\n[features]\ndefault_font = []\nsystem_font_discovery = [\"parley/system\"]\nsystem_clipboard = [\"bevy_clipboard/system_clipboard\"]\n\n[dependencies]\n# bevy\nbevy_app = { path = \"../bevy_app\", version = \"0.19.0-dev\" }\nbevy_asset = { path = \"../bevy_asset\", version = \"0.19.0-dev\" }\nbevy_clipboard = { path = \"../bevy_clipboard\", version = \"0.19.0-dev\", default-features = false }\nbevy_color = { path = \"../bevy_color\", version = \"0.19.0-dev\" }\nbevy_derive = { path = \"../bevy_derive\", version = \"0.19.0-dev\" }\nbevy_ecs = { path = \"../bevy_ecs\", version = \"0.19.0-dev\" }\nbevy_image = { path = \"../bevy_image\", version = \"0.19.0-dev\" }\nbevy_log = { path = \"../bevy_log\", version = \"0.19.0-dev\" }\nbevy_math = { path = \"../bevy_math\", version = \"0.19.0-dev\" }\nbevy_reflect = { path = \"../bevy_reflect\", version = \"0.19.0-dev\", features = [\n  \"smol_str\",\n] }\nbevy_utils = { path = \"../bevy_utils\", version = \"0.19.0-dev\" }\nbevy_platform = { path = \"../bevy_platform\", version = \"0.19.0-dev\", default-features = false, features = [\n  \"std\",\n  \"serialize\",\n] }\n\n# other\nwgpu-types = { version = \"29.0.3\", default-features = false }\nthiserror = { version = \"2\", default-features = false }\nserde = { version = \"1\", features = [\"derive\"] }\nsmallvec = { version = \"1\", default-features = false }\nsmol_str = { version = \"0.2\", default-features = false }\nsys-locale = \"0.3.0\"\ntracing = { version = \"0.1\", default-features = false, features = [\"std\"] }\nparley = { version = \"0.9.0\", default-features = false, features = [\"std\"] }\nswash = { version = \"0.2.6\" }\n\n[lints.clippy]\ndoc_markdown = \"warn\"\nmanual_let_else = \"warn\"\nmatch_same_arms = \"warn\"\nredundant_closure_for_method_calls = \"warn\"\nredundant_else = \"warn\"\nsemicolon_if_nothing_returned = \"warn\"\ntype_complexity = \"allow\"\nundocumented_unsafe_blocks = \"warn\"\nunwrap_or_default = \"warn\"\nneedless_lifetimes = \"allow\"\ntoo_many_arguments = \"allow\"\nnonstandard_macro_braces = \"warn\"\nprint_stdout = \"warn\"\nprint_stderr = \"warn\"\nptr_as_ptr = \"warn\"\nptr_cast_constness = \"warn\"\nref_as_ptr = \"warn\"\ntoo_long_first_doc_paragraph = \"allow\"\nstd_instead_of_core = \"allow\"\nstd_instead_of_alloc = \"warn\"\nalloc_instead_of_core = \"warn\"\nallow_attributes = \"warn\"\nallow_attributes_without_reason = \"warn\"\n\n[lints.rust]\nmissing_docs = \"warn\"\nunexpected_cfgs = { level = \"warn\", check-cfg = ['cfg(docsrs_dep)'] }\nunsafe_code = \"deny\"\nunsafe_op_in_unsafe_fn = \"warn\"\nunused_qualifications = \"warn\"\n\n\n[package.metadata.docs.rs]\nrustdoc-args = [\n  \"-Zunstable-options\",\n  \"--generate-link-to-definition\",\n  \"--generate-macro-expansion\",\n]\nall-features = true\n"
